server:
  port: 8080

spring:
  application:
    name: trade-ledger

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:tradeledger}
    username: ${POSTGRES_USER:tradeledger}
    password: ${POSTGRES_PASSWORD:tradeledger}
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:tradeledger}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# --- Application-specific ---
app:
  price:
    symbols: AAPL,GOOGL,MSFT,AMZN,TSLA,META,NVDA,JPM,V,JNJ
    cache-ttl-seconds: 10
    update-interval-ms: 2000
  rebalance:
    drift-threshold: 0.02
    min-cash-buffer: 100.00
  matching:
    max-retries: 3
